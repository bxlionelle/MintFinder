name: mintfinder_1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  image: ^4.2.0
  tflite_flutter: ^0.12.1
  opencv_dart: ^1.3.4
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/models/model.tflite
    - assets/models/scaler.json
    - assets/models/label_map.json
    - assets/images/logo.png
    - assets/images/bg_pattern.jpg
    - assets/images/capture_guide.jpg
    - assets/models/fusion_thresholds.json
    - assets/plants/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"